<meta name="hz:slide-selector" content="[data-canvas-width]"><meta name="hz:canvas-width" content="390"><meta name="hz:canvas-height" content="844"></head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
button,input{font:inherit}
.card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);box-shadow:0 16px 40px -22px rgba(0,0,0,.6);border-radius:16px;padding:16px}
.h{margin:0;color:#e2e8f0;font-size:15px;font-weight:600}
.m{margin:4px 0 0;color:#94a3b8;font-size:13px;line-height:1.45}
.in{width:100%;box-sizing:border-box;height:48px;border-radius:12px;border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.28);color:#e2e8f0;padding:0 14px;font-size:15px}
.in:focus{outline:2px solid rgba(255,255,255,.55);border-color:rgba(255,255,255,.55)}
.btn{height:48px;border:1px solid rgba(255,255,255,.3);border-radius:12px;background:rgba(255,255,255,.16);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:#ffffff;font-weight:600;font-size:15px;cursor:pointer;width:100%}
.nb{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;cursor:pointer;position:relative;z-index:1;min-height:52px}
.orb{transform-origin:195px 130px;animation:spin 40s linear infinite}
.orb2{transform-origin:195px 130px;animation:spin 26s linear infinite reverse}
.pt{opacity:.8;animation-name:tw,fl;animation-iteration-count:infinite;animation-timing-function:ease-in-out}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:.95}}
@keyframes fl{0%,100%{transform:translate(0,0)}50%{transform:translate(6px,-10px)}}
@media (prefers-reduced-motion:reduce){.pt{animation:none}}
@keyframes ring{0%{transform:rotate(0)}15%{transform:rotate(-17deg)}30%{transform:rotate(14deg)}45%{transform:rotate(-9deg)}60%{transform:rotate(6deg)}78%{transform:rotate(-3deg)}100%{transform:rotate(0)}}
.bt{border:0;height:44px;border-radius:22px;padding:0 19px;display:inline-flex;align-items:center;gap:9px;font-size:13.5px;font-weight:500;cursor:pointer;white-space:nowrap;transition:background-color .2s ease,color .2s ease,transform .16s ease}
.bt:active{transform:scale(.97)}
.bt:focus-visible{outline:2px solid rgba(255,255,255,.55);outline-offset:2px}
.bt-g{transform-origin:50% 16%;display:block}
.bt-f{grid-area:1/1;transition:opacity .2s ease}
@media (prefers-reduced-motion:reduce){.bt-g{animation:none!important}.bt{transition:none}}
@keyframes spin{to{transform:rotate(360deg)}}
.row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.1);color:#cbd5e1;font-size:14px}
.tag{font-size:11px;color:#94a3b8;border:1px solid rgba(255,255,255,.14);border-radius:99px;padding:2px 8px}
.tst{position:relative;display:flex;align-items:center;gap:8px;padding:14px 14px 14px 16px;border-radius:12px;overflow:hidden;background:#27272a;color:#f5f5f5;border:1px solid rgba(255,255,255,.1);box-shadow:0 1px 2px rgba(0,0,0,.2),0 8px 24px rgba(0,0,0,.5);touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.tst-b{flex:none;height:32px;padding:0 10px;border:0;border-radius:6px;font:inherit;font-size:12px;font-weight:500;cursor:pointer;transition:transform .16s ease,opacity .16s ease}
.tst-b:active{transform:scale(.97)}
.tst-b:focus-visible{outline:2px solid rgba(255,255,255,.7);outline-offset:2px}
@keyframes tst-burn{from{transform:scaleX(1)}to{transform:scaleX(0)}}
@media (prefers-reduced-motion:reduce){.tst-b{transition:none}}
.nosb{scrollbar-width:none;-ms-overflow-style:none}
.nosb::-webkit-scrollbar{display:none;width:0;height:0}
@keyframes ac-in{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
.ac>*{animation:ac-in .8s cubic-bezier(.215,.61,.355,1) backwards}
.ac>*:nth-child(1){animation-delay:0.0s}
.ac>*:nth-child(2){animation-delay:0.08s}
.ac>*:nth-child(3){animation-delay:0.16s}
.ac>*:nth-child(4){animation-delay:0.24s}
.ac>*:nth-child(5){animation-delay:0.32s}
.ac>*:nth-child(6){animation-delay:0.4s}
.ac>*:nth-child(7){animation-delay:0.48s}
.ac>*:nth-child(8){animation-delay:0.56s}
.ac>*:nth-child(9){animation-delay:0.64s}
.ac>*:nth-child(10){animation-delay:0.72s}
.ac>*:nth-child(11){animation-delay:0.8s}
.ac>*:nth-child(12){animation-delay:0.88s}
.ac>*:nth-child(13){animation-delay:0.96s}
.ac>*:nth-child(14){animation-delay:1.04s}
.ac.ac-s>*:nth-child(1){animation-delay:0.2s}
.ac.ac-s>*:nth-child(2){animation-delay:0.24s}
.ac.ac-s>*:nth-child(3){animation-delay:0.28s}
.ac.ac-s>*:nth-child(4){animation-delay:0.32s}
.ac.ac-s>*:nth-child(5){animation-delay:0.36s}

.ac.ac-s>*:nth-child(7){animation-delay:0.44s}

<div role="group" aria-roledescription="slide" aria-label="1 of 3" class="card" style="flex:0 0 100%;min-height:208px;box-sizing:border-box;scroll-snap-align:center;display:flex;flex-direction:column;gap:10px;transition:transform .35s ease,opacity .35s ease;transform:scale({{ car.s0 }});opacity:{{ car.o0 }}">
<div style="display:flex;justify-content:space-between;align-items:center"><h2 class="h">Latest assessment</h2><span class="tag">18 Oct</span></div>
<div style="display:flex;align-items:center;gap:14px"><div style="width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#7c6a63,#3b2f2b);border:1px solid rgba(255,255,255,.2);flex:none" aria-hidden="true"></div><div><p style="margin:0;color:#f1f5f9;font-size:17px;font-weight:600">Left forearm</p><p class="m" style="margin:2px 0 0">Low concern · stable vs. last visit</p></div></div>
<div style="display:flex;gap:8px;flex-wrap:wrap"><span class="tag">Size 4.2 mm</span><span class="tag">Colour even</span><span class="tag">Border regular</span></div>
<p class="m" style="margin-top:auto">Keep monitoring. Re-photograph in 30 days.</p>
</div>
<div role="group" aria-roledescription="slide" aria-label="2 of 3" class="card" style="flex:0 0 100%;min-height:208px;box-sizing:border-box;scroll-snap-align:center;display:flex;flex-direction:column;gap:2px;transition:transform .35s ease,opacity .35s ease;transform:scale({{ car.s1 }});opacity:{{ car.o1 }}">
<div style="display:flex;justify-content:space-between;align-items:center"><h2 class="h">Recently monitored lesions</h2><span class="tag">3 active</span></div>
<sc-for list="{{ car.lesions }}" as="l" hint-placeholder-count="3">
<div class="row"><div style="display:flex;align-items:center;gap:10px"><span style="width:10px;height:10px;border-radius:50%;background:{{ l.dot }};flex:none" aria-hidden="true"></span><span>{{ l.name }}</span></div><span style="color:#94a3b8;font-size:12px">{{ l.when }}</span></div>
</sc-for>
</div>
<div role="group" aria-roledescription="slide" aria-label="3 of 3" class="card" style="flex:0 0 100%;min-height:208px;box-sizing:border-box;scroll-snap-align:center;display:flex;flex-direction:column;gap:2px;transition:transform .35s ease,opacity .35s ease;transform:scale({{ car.s2 }});opacity:{{ car.o2 }}">
<div style="display:flex;justify-content:space-between;align-items:center"><h2 class="h">Upcoming follow-ups</h2><span class="tag">Next 30 days</span></div>
<sc-for list="{{ car.ups }}" as="u" hint-placeholder-count="3">
<div class="row"><div style="display:flex;align-items:center;gap:12px"><div style="width:40px;text-align:center;flex:none"><div style="font-size:15px;font-weight:600;color:#f1f5f9;line-height:1.1">{{ u.day }}</div><div style="font-size:10px;color:#94a3b8;text-transform:uppercase">{{ u.mon }}</div></div><span>{{ u.what }}</span></div></div>
</sc-for>
</div>
</div>
<div style="display:flex;align-items:center;justify-content:center;gap:2px">
<sc-for list="{{ car.dots }}" as="d" hint-placeholder-count="3"><button aria-label="{{ d.label }}" aria-current="{{ d.cur }}" sc-camel-on-click="{{ d.go }}" style="width:24px;height:44px;border:0;background:none;padding:0;cursor:pointer;display:grid;place-items:center"><span style="display:block;height:8px;width:{{ d.w }}px;border-radius:4px;background:{{ d.bg }};transition:width .25s ease,background-color .25s ease"></span></button></sc-for>
</div>
</div>
<p class="m" style="font-size:12px">DermaTrace supports monitoring and does not replace a dermatologist.</p>
</div></sc-if>

<sc-if value="{{ v.lesions }}"><div class="ac" style="display:flex;flex-direction:column;gap:14px">
<h1 style="margin:0;font-size:24px">My lesions</h1>
<input class="in" type="search" placeholder="Search lesions" aria-label="Search lesions">
<div style="display:flex;gap:8px"><span class="tag">List</span><span class="tag">Grid</span><span class="tag">Filter</span><span class="tag">Sort</span></div>
<div class="card" style="text-align:center"><h2 class="h">No lesions saved</h2><p class="m">Add a lesion with its body location to begin tracking changes over time.</p><button class="btn" style="margin-top:12px" sc-camel-on-click="{{ goCapture }}">Add new lesion</button></div>
</div></sc-if>

<sc-if value="{{ v.capture }}"><div class="ac" style="display:flex;flex-direction:column;gap:14px">
<h1 style="margin:0;font-size:24px">Capture skin photo</h1>
<div style="height:260px;border-radius:20px;border:1px dashed #444444;background:#0a0a0a;display:flex;align-items:center;justify-content:center;position:relative"><div style="width:130px;height:130px;border-radius:50%;border:2px solid rgba(255,255,255,.7)"></div><span class="m" style="position:absolute;bottom:12px;font-size:12px">Centre the lesion with a ruler or coin nearby</span></div>
<div class="card"><h2 class="h">Image quality check</h2>
<div class="row"><span>Focus / blur</span><span class="tag">Pending</span></div><div class="row"><span>Lighting</span><span class="tag">Pending</span></div><div class="row" style="border:0"><span>Lesion visible</span><span class="tag">Pending</span></div></div>
<div style="display:flex;gap:10px"><button class="btn" style="background:rgba(255,255,255,.05);color:#e2e8f0;border:1px solid rgba(255,255,255,.14)">Gallery</button><button class="btn">Take photo</button></div>
</div></sc-if>

<sc-if value="{{ v.progress }}"><div class="ac" style="display:flex;flex-direction:column;gap:14px">
<h1 style="margin:0;font-size:24px">Progress</h1>
<div class="card" style="display:flex;flex-direction:column;gap:14px">

</div>
<p class="m" style="font-size:12px">Illustrative values only. Real measurements appear after your first analysed visits.</p>
</div>
<div class="card"><h2 class="h">Before and after</h2><p class="m">Side-by-side and overlay comparison unlock once a lesion has two visits.</p></div>
<div class="card"><h2 class="h">Timeline</h2><p class="m">Visits, photos and assessments will list here in order.</p></div>
<button class="btn" style="background:rgba(255,255,255,.05);color:#e2e8f0;border:1px solid rgba(255,255,255,.14)">Export history</button>
</div></sc-if>

<sc-if value="{{ v.profile }}"><div class="ac" style="display:flex;flex-direction:column;gap:16px;min-height:100%">
<div style="display:flex;align-items:center;gap:14px"><div aria-hidden="true" style="width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#ffffff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:600">{{ pf.initials }}</div><div style="flex:1;min-width:0"><h1 style="margin:0;font-size:24px">Profile</h1><p class="m" style="margin:2px 0 0">Manage your details and preferences</p></div><span class="tag">{{ s.roleLabel }}</span></div>
<div class="card" style="display:flex;flex-direction:column;gap:14px"><h2 class="h">Personal information</h2>
<label style="display:flex;flex-direction:column;gap:6px;color:#94a3b8;font-size:13px">Full name<input class="in" type="text" autocomplete="name" value="{{ pf.name }}" sc-camel-on-change="{{ setName }}"></label>
<label style="display:flex;flex-direction:column;gap:6px;color:#94a3b8;font-size:13px">Email address<input class="in" type="email" autocomplete="email" value="{{ pf.email }}" sc-camel-on-change="{{ setPfEmail }}"></label>
<label style="display:flex;flex-direction:column;gap:6px;color:#94a3b8;font-size:13px">Date of birth<input class="in" type="text" placeholder="DD / MM / YYYY" value="{{ pf.dob }}" sc-camel-on-change="{{ setDob }}"></label></div>
<div class="card" style="padding:4px 16px"><h2 class="h" style="padding:12px 0 2px">Preferences</h2>
<sc-for list="{{ toggles }}" as="item" hint-placeholder-count="3">
<div class="row" style="gap:12px"><div style="flex:1;min-width:0"><div style="color:#e2e8f0">{{ item.label }}</div><div class="m" style="margin:2px 0 0;font-size:12px">{{ item.desc }}</div></div><button type="button" role="switch" aria-label="{{ item.label }}" sc-camel-aria-checked="{{ item.on }}" sc-camel-on-click="{{ item.flip }}" style="position:relative;flex:none;width:52px;height:44px;border:0;background:none;cursor:pointer;padding:0"><span style="position:absolute;left:0;top:10px;width:52px;height:24px;border-radius:12px;background:{{ item.track }};transition:background-color .2s ease"></span><span style="position:absolute;top:13px;left:{{ item.knob }}px;width:18px;height:18px;border-radius:50%;background:#ffffff;transition:left .2s ease"></span></button></div>

<button class="btn" style="background:rgba(255,255,255,.05);color:#fca5a5;border:1px solid rgba(255,255,255,.14)" sc-camel-on-click="{{ signOut }}">Sign out</button>

<sc-if value="{{ v.overview }}"><div class="ac" style="display:flex;flex-direction:column;gap:14px">

<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px"><div class="card"><p class="m" style="margin:0">Users</p><h2 class="h" style="font-size:22px">—</h2></div><div class="card"><p class="m" style="margin:0">Analyses</p><h2 class="h" style="font-size:22px">—</h2></div><div class="card"><p class="m" style="margin:0">Inconclusive</p><h2 class="h" style="font-size:22px">—</h2></div><div class="card"><p class="m" style="margin:0">Failures</p><h2 class="h" style="font-size:22px">—</h2></div></div>

</div></sc-if>

<sc-if value="{{ v.users }}"><div class="ac" style="display:flex;flex-direction:column;gap:14px">

<div class="card" style="text-align:center"><h2 class="h">No users loaded</h2><p class="m">Manage roles, suspend accounts and review consent records here.</p></div>
</div></sc-if>

<sc-if value="{{ v.models }}"><div class="ac" style="display:flex;flex-direction:column;gap:14px">
<h1 style="margin:0;font-size:24px">Models</h1>
<div class="card" style="padding:4px 16px"><div class="row"><span>U-Net segmentation</span><span class="tag">Not connected</span></div><div class="row"><span>MobileNetV2 classifier</span><span class="tag">Not connected</span></div><div class="row" style="border:0"><span>Siamese CNN comparison</span><span class="tag">Not connected</span></div></div>

<sc-if value="{{ v.aprofile }}"><div class="ac" style="display:flex;flex-direction:column;gap:6px">

<div class="card" style="padding:4px 16px"><div class="row"><span>Account</span><span class="tag">Admin</span></div><div class="row"><span>Audit log</span></div><div class="row" style="border:0"><span>Security</span></div></div>
<button class="btn" style="margin-top:12px;background:rgba(255,255,255,.05);color:#fca5a5;border:1px solid rgba(255,255,255,.14)" sc-camel-on-click="{{ signOut }}">Sign out</button>
</div></sc-if>
</div>

</sc-for>
</ul>
<span class="pn__glide" aria-hidden="true"></span>
<ul class="pn__ink" aria-hidden="true">
<sc-for list="{{ navItems }}" as="item" hint-placeholder-count="5">
<li class="pn__inkitem"><svg sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ item.d }}"></path></svg><span>{{ item.label }}</span></li>
</sc-for>
</ul>
</div>
<span class="pn__rim"></span>
</nav>

</div></div></div>
